<article class="entry-detail" data-entry="{{.Name}}">
<input type="hidden" id="selected-entry" name="selected" value="{{.Name}}">
{{- if .Notice}}
<p class="notice" role="status">{{.Notice}}</p>
{{- end}}
<h2>{{.Name}}</h2>
<p class="entry-actions">
<button type="button" hx-get="{{editURL .Name}}" hx-target="#right-pane" hx-swap="innerHTML">編集</button>
{{template "regenerate-button" .Name}}
<button type="button" class="delete-button" hx-get="{{.DeleteURL}}" hx-target="#right-pane" hx-swap="innerHTML">削除</button>
</p>
<div class="password-row">
<label for="entry-password">パスワード</label>
<input id="entry-password" class="secret" type="password" value="{{.Password}}" readonly autocomplete="off" spellcheck="false">
<button type="button" data-reveal="#entry-password" aria-pressed="false">表示</button>
<button type="button" data-copy-secret>コピー</button>
</div>
{{- if .Fields}}
<dl class="fields">
{{- range .Fields}}
{{- if .Key}}
<div class="field"><dt>{{.Key}}</dt><dd>{{.Value}}</dd><button type="button" data-copy-secret>コピー</button></div>
{{- else}}
<div class="field"><dd class="line">{{.Value}}</dd></div>
{{- end}}
{{- end}}
</dl>
{{- end}}
</article>
{{template "lock-badge" .Badge}}
