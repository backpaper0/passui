<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>passui - ログインが必要です</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/passui.css">
</head>
<body class="standalone">
<main class="standalone-card">
<h1 class="brand">passui</h1>
{{if .WrongHost}}
<h2>このアドレスではログインできません</h2>
<p>ログインは <code>http://{{.LoginHost}}/</code> でだけ受け付けます。<code>passui login</code> が出す URL をそのまま開いてください。</p>
{{else}}
<h2>ログインしていません</h2>
<p>ゲストのターミナルで次を実行し、表示された URL をこのブラウザで開いてください。</p>
<pre><code>passui login</code></pre>
{{end}}
</main>
</body>
</html>
