<form class="entry-form" data-entry="{{.Name}}" hx-post="{{editURL .Name}}" hx-target="#right-pane" hx-swap="innerHTML">
<input type="hidden" id="selected-entry" name="selected" value="{{.Name}}">
<h2>{{.Name}} を編集</h2>
{{- if .Failure}}
<p class="error" role="alert">{{.Failure}}</p>
{{- end}}
{{- if .Conflict}}
<p class="actions conflict-actions">
<button type="button" hx-get="{{editURL .Name}}" hx-target="#right-pane" hx-swap="innerHTML">最新を読み直す（入力は破棄）</button>
{{- if .OverwriteHash}}
<button type="submit" name="overwrite" value="{{.OverwriteHash}}">それでも上書きする</button>
{{- end}}
</p>
{{- end}}
<input type="hidden" name="hash" value="{{.Hash}}">
<label for="edit-path">パス</label>
<input id="edit-path" name="path" value="{{.Path}}" readonly required autocomplete="off" autocapitalize="off" spellcheck="false">
<label for="edit-content">本文</label>
<textarea id="edit-content" name="content" rows="8" required autocomplete="off" autocapitalize="off" spellcheck="false">
{{.Content}}</textarea>
<p class="hint">1 行目がパスワードです。2 行目以降に <code>key: value</code> を書けます。</p>
<p class="actions">
<button type="submit">保存</button>
<button type="button" hx-get="{{entryURL .Name}}" hx-target="#right-pane" hx-swap="innerHTML">キャンセル</button>
</p>
</form>
{{- if .Badge.State}}
{{template "lock-badge" .Badge}}
{{- end}}
